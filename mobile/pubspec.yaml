name: fitmonk_shell
description: FitMonk native shell wrapping the production web app.
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # 6.2.0-beta.3 ships the flutter_inappwebview_android fix for the newer
  # Android Gradle Plugin proguard-file requirement. Safe for local device
  # testing; revisit when 6.2.x goes stable.
  flutter_inappwebview: ^6.2.0-beta.3

  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # 11.x removes the dead jcenter() reference from the plugin's android
  # build.gradle. API used here (purchase(QPurchaseModel), updatedEntitlementsStream,
  # checkEntitlements, restore, offerings, identify, logout) is unchanged.
  qonversion_flutter: ^11.10.0

  # Google's OAuth refuses to authenticate inside an embedded WebView
  # (disallowed_useragent), so the shell drives sign-in natively and hands
  # the id token back through the bridge for signInWithCredential.
  google_sign_in: ^6.2.2

  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.2
  cross_file: ^0.3.4+2
  shared_preferences: ^2.3.2

  # Camera capture for <input type="file" capture>. The WebView plugin's own
  # camera handoff comes back empty with some OEM camera apps, so the shell
  # takes the photo itself and hands the file to the page.
  image_picker: ^1.2.4

  cupertino_icons: ^1.0.8
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  timezone: ^0.9.4
  speech_to_text: ^7.5.0
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.17

dev_dependencies:
  flutter_lints: ^4.0.0

  # One-shot generators for the launcher icon and splash resources —
  # regenerated on demand, so they only run when the source PNGs change.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # App Store rejects icons with transparency.
  remove_alpha_ios: true
  background_color_ios: "#0c2723"
  image_path: "assets/icons/app-icon.png"
  # Adaptive icon (Android 8+): the mark sits on the brand-teal ground so
  # it survives the OS's circle/rounded-square/squircle mask.
  adaptive_icon_background: "#0c2723"
  adaptive_icon_foreground: "assets/icons/mark.png"
  min_sdk_android: 23

# Regenerate with: dart run flutter_native_splash:create
# Same look as the web favicon: mint ring and orange leaf on brand teal.
# splash.png is the mark padded onto a 1152px canvas so it fits inside the
# circle Android 12+ crops the splash icon to (the inner 768px); the bare
# mark.png filled the canvas and got its edges cut off.
flutter_native_splash:
  color: "#0e4b45"
  image: "assets/icons/splash.png"
  ios: true
  android_12:
    color: "#0e4b45"
    image: "assets/icons/splash.png"
